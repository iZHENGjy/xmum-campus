<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>雪邦赛车城 · 画面 demo</title>
<!-- 雪邦赛车城的 30 秒画面 demo（docs/sepang-plan.md 第 7.4 节）。只给电脑看；不读存档、不连数据库，没有声音。
     用的是放进仓库的固定版本：Three.js 0.186.1（vendor/three，MIT）和 postprocessing 6.39.5（vendor/postprocessing，Zlib），不需要构建步骤。 -->
<script>window.XMUM_FIREBASE = null;</script>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.js",
  "three/addons/": "./vendor/three/examples/jsm/",
  "postprocessing": "./vendor/postprocessing/index.js"
} }
</script>
<style>
:root{--ink:#f4ede0;--dim:rgba(244,237,224,.72);--accent:#c4532c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d0f12;overflow:hidden;color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif}
canvas#c{display:block;width:100vw;height:100vh}
/* cinema bars, slid in during the film and 「路流过来」 */
body::before,body::after{content:"";position:fixed;left:0;right:0;height:0;background:#000;z-index:3;transition:height .9s ease}
body::before{top:0} body::after{bottom:0}
body.film::before,body.film::after{height:calc((100vh - 100vw / 2.39) / 2)}
#fps{position:fixed;left:14px;top:12px;z-index:5;font:600 12px/1 ui-monospace,Consolas,monospace;color:var(--dim);letter-spacing:.04em;text-shadow:0 1px 2px #000}
#spd{position:fixed;right:24px;bottom:22px;z-index:5;font:800 30px/1 "Noto Sans SC",sans-serif;font-variant-numeric:tabular-nums;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#count{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:5;font:900 76px/1 sans-serif;letter-spacing:.1em;text-shadow:0 4px 18px rgba(0,0,0,.6)}
#sub{position:fixed;left:50%;bottom:calc((100vh - 100vw / 2.39) / 2 + 24px);transform:translateX(-50%);z-index:6;max-width:80vw;text-align:center;font:500 22px/1.5 "Noto Sans SC",sans-serif;text-shadow:0 1px 3px #000,0 0 18px rgba(0,0,0,.5);opacity:0;transition:opacity .45s}
#sub.on{opacity:1}
#sub span{display:block;font-size:14px;color:var(--dim);letter-spacing:.1em}
#sub span:empty{display:none}
#menu{position:fixed;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at center,rgba(13,15,18,.35),rgba(13,15,18,.78))}
#menu[hidden]{display:none}
#menu h1{margin:0;font:700 40px/1.2 "Noto Serif SC","Songti SC","SimSun",serif;letter-spacing:.12em}
#menu p{margin:0;color:var(--dim);font-size:15px}
#menu .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#menu button{font:600 16px "Noto Sans SC",sans-serif;color:var(--ink);background:rgba(244,237,224,.08);border:1px solid rgba(244,237,224,.35);border-radius:999px;padding:11px 22px;cursor:pointer}
#menu button:hover,#menu button:focus-visible{background:rgba(196,83,44,.85);border-color:transparent;outline:none}
#menu kbd{font:600 12px ui-monospace,monospace;opacity:.7;margin-left:6px}
#hint{position:fixed;left:14px;bottom:14px;z-index:5;font-size:13px;line-height:1.7;color:var(--dim);text-shadow:0 1px 2px #000}
#fade{position:fixed;inset:0;z-index:8;background:#000;opacity:0;pointer-events:none;transition:opacity .5s}
#fade.on{opacity:1}
#loading{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:#0d0f12;font-size:15px;color:var(--dim)}
#loading[hidden]{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fps">…</div>
<div id="spd"></div>
<div id="count"></div>
<div id="sub"></div>
<div id="hint" hidden>W/S 油门刹车 · A/D 转向 · Shift 氮气 · 空格 手刹 · C 换镜头 · R 下雨 · Q 画质 · Esc 菜单</div>
<div id="menu" hidden>
  <h1>雪邦赛车城</h1>
  <p>两倍还原的雪邦 · 主直道 → 一号弯 → 湖边 · 傍晚雨后 · 画面 demo</p>
  <div class="row">
    <button id="bAuto" type="button">再看一遍<kbd>空格</kbd></button>
    <button id="bFree" type="button">自己开<kbd>Enter</kbd></button>
    <button id="bFlow" type="button">路流过来<kbd>F</kbd></button>
  </div>
  <p>R 下雨 / 放晴 · Q 换画质（低 / 中 / 高）· 「路流过来」里点一下画面，用鼠标环顾</p>
</div>
<div id="fade"></div>
<div id="loading">正在搭建赛道……</div>
<script type="module" src="js/demo.js"></script>
</body>
</html>
