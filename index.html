<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XMUM 校园漫游</title>
<meta name="description" content="照厦门大学马来西亚分校平面图搭的 3D 校园小游戏：奶娃开车、黑洞吞校园。粉丝作品，非官方。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="c" class="grab" tabindex="0" aria-label="三维校园场景"></canvas>
<div id="labels"></div>

<div class="topbar">
  <div class="panel brand">
    <div class="eyebrow">雪兰莪 · 雪邦 · 照平面图搭建</div>
    <div class="title">
      <svg viewBox="0 0 30 18" aria-hidden="true"><path d="M1 13 C7 12 10 6 15 2 C20 6 23 12 29 13 L26 15 L4 15 Z" fill="var(--tile)"/><rect x="6" y="15" width="18" height="3" fill="var(--muted)"/></svg>
      <h1>XMUM 校园漫游</h1>
    </div>
    <div class="prog"><span>打卡</span><b id="cnt">0 / 8</b><div class="bar"><i id="barfill"></i></div></div>
    <div class="chips" id="chips"></div>
    <div class="note">布局照 2025 年 9 月校园平面图摆放，外观参考公开照片简化，层数是估计。</div>
  </div>
  <div class="side">
    <div class="panel ctrls">
      <div class="seg" role="group" aria-label="视角">
        <button id="m-orbit" aria-pressed="true">俯瞰</button>
        <button id="m-walk" aria-pressed="false">漫游</button>
        <button id="m-naiwa" aria-pressed="false">奶娃</button>
        <button id="m-hole" aria-pressed="false">黑洞</button>
      </div>
      <div class="seg" role="group" aria-label="时间">
        <button data-t="day" aria-pressed="true">白天</button>
        <button data-t="dusk" aria-pressed="false">黄昏</button>
        <button data-t="night" aria-pressed="false">夜晚</button>
      </div>
    </div>
    <div class="panel gstat" id="gstat" hidden>
      <div class="grow"><span>钱包</span><b id="money">RM 0.00</b></div>
      <div class="grow"><span>车速</span><b id="speed">0 km/h</b></div>
      <div class="grow"><span>保安警戒</span><b id="stars" class="stars">☆☆☆☆☆</b></div>
      <div class="grow"><span>特技分</span><b id="stunt">0</b></div>
      <div class="grow"><span>车况</span><b id="hp">—</b></div>
      <div class="mission" id="mission">走进或开进橙色光圈接外卖单</div>
      <button class="btn gbtn" id="garageBtn">XMUM 车行</button>
    </div>
    <div class="panel gstat" id="hstat" hidden>
      <div class="grow"><span>剩余</span><b id="htime">2:00</b></div>
      <div class="grow"><span>黑洞直径</span><b id="hsize">5 米</b></div>
      <div class="grow"><span>吞掉校园</span><b id="hpct">0%</b></div>
      <div class="grow"><span>排名</span><b id="hrank">1 / 4</b></div>
      <div class="rank" id="hlist"></div>
      <div class="mission" id="hnext">先吃树、长椅和路灯，长大了再吞楼</div>
    </div>
    <canvas id="mini" width="300" height="300" hidden aria-label="小地图"></canvas>
  </div>
</div>

<div class="bottombar">
  <div class="panel help" id="help"></div>
  <div class="panel card" id="card" hidden>
    <button class="x" id="cardx" aria-label="关闭">×</button>
    <span class="tag" id="ctag"></span>
    <h2 id="cname"></h2>
    <p id="cdesc"></p>
    <div class="row"><span class="meta" id="cmeta"></span><button class="btn" id="cardwalk">走到这里</button></div>
  </div>
</div>

<div class="panel" id="joy" hidden><div id="knob"></div></div>
<div class="panel" id="compass" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L19 21 L12 16.5 L5 21 Z" fill="var(--tile)"/></svg><span id="cdist"></span></div>
<div class="panel" id="prompt" hidden></div>
<div class="panel" id="combo" hidden></div>
<div class="panel" id="shop" hidden>
  <div class="shop-h"><h2>XMUM 车行</h2><span id="shopMoney">RM 0.00</span></div>
  <button class="x" id="shopx" aria-label="关闭">×</button>
  <div id="shopList"></div>
  <div class="shop-f">送外卖、玩特技赚钱。买过的车随时能叫到身边，叫一次就修好一次。</div>
</div>
<div class="panel" id="hend" hidden>
  <div class="eyebrow">时间到</div>
  <h2 id="hendT">吞掉了 XMUM 的 0%</h2>
  <p id="hendS"></p>
  <div class="hrow"><button class="btn" id="hagain">再来一局</button><button class="btn" id="hquit">去开车</button></div>
</div>
<div id="acts" hidden>
  <button id="act-f"><b>上车</b><kbd>F</kbd></button>
  <button id="act-sp"><b>跳</b><kbd>空格</kbd></button>
  <button id="act-r"><b>大笑</b><kbd>R</kbd></button>
  <button id="act-q"><b>撩头</b><kbd>Q</kbd></button>
</div>
<div class="panel" id="toast" role="status" aria-live="polite"></div>
<div class="panel" id="err" hidden>这个浏览器打不开 3D 画面（需要 WebGL）。换个浏览器试试。</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="js/00-core.js"></script>
<script src="js/10-world.js"></script>
<script src="js/20-fx.js"></script>
<script src="js/30-naiwa.js"></script>
<script src="js/40-vehicles.js"></script>
<script src="js/50-missions.js"></script>
<script src="js/60-details.js"></script>
<script src="js/70-hole.js"></script>
<script src="js/80-gta.js"></script>
<script src="js/90-main.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/net.js"></script>
</body>
</html>
