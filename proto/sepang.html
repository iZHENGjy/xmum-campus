<title>雪邦赛车城 · 灰盒原型</title>
<!-- 雪邦赛车城的灰盒原型（docs/sepang-plan.md）：只有赛道、地标方块和照抄游戏的车辆手感，用来试弯道好不好开。
     不连任何数据库（window.XMUM_FIREBASE = null，也没有加载 net.js），没有声音。纪录只存在本机 localStorage 'xmum-proto-sepang'。
     手感照抄 js/40-vehicles.js 的 updateCar 和 js/94-f1-drive.js 的赛道手感（抓地极限转向、超速擦胎、360 km/h 以上打对折），
     只有一处不同：超速擦胎按「方向盘往弯里打」判断（游戏里现在的判断方向是反的，见方案第 1.2 节）。 -->
<script>window.XMUM_FIREBASE = null;</script>
<style>
:root{--ink:#1f2a33;--paper:#f7f5ef;--ok:#2e9d5b;--near:#d9901a;--over:#d0473b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#9fb7c9;overflow:hidden;font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
canvas#c{display:block;width:100vw;height:100vh}
.panel{position:fixed;background:rgba(247,245,239,.92);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.18);padding:8px 12px;font-size:13px}
#hud{left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);min-width:190px}
#spd{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
#spd small{font-size:13px;font-weight:700;margin-left:4px}
#lap{font-variant-numeric:tabular-nums;margin-top:4px;line-height:1.5}
#adv{left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);font-weight:700;white-space:nowrap}
#adv b{font-size:18px;font-variant-numeric:tabular-nums}
#adv.ok b{color:var(--ok)} #adv.near b{color:var(--near)} #adv.over b{color:var(--over)}
#cars{right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:6px}
#cars button,#help button{font:inherit;font-size:13px;border:1px solid #c9c4b6;background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--ink)}
#cars button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
#mini{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:200px;height:150px;background:rgba(247,245,239,.85);border-radius:12px}
#help{left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:360px;line-height:1.55}
#nos{height:6px;border-radius:3px;background:#dcd6c8;margin-top:6px;overflow:hidden}
#nos i{display:block;height:100%;width:100%;background:#7d5cff}
#msg{left:50%;top:40%;transform:translate(-50%,-50%);font-size:22px;font-weight:900;display:none}
#touch{position:fixed;inset:auto 0 calc(env(safe-area-inset-bottom,0px) + 10px) 0;display:none;justify-content:space-between;padding:0 12px;pointer-events:none}
#touch div{display:flex;gap:10px;pointer-events:auto}
#touch button{width:74px;height:74px;border-radius:50%;border:0;background:rgba(31,42,51,.55);color:#fff;font:700 15px inherit;touch-action:none}
#touch button.on{background:rgba(31,42,51,.85)}
@media (pointer:coarse){#touch{display:flex}#help{display:none}#mini{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 150px);width:150px;height:112px}}
</style>
</head>

<div id="adv" class="panel" hidden></div>
<div id="cars" class="panel" role="group" aria-label="选车"></div>
<canvas id="mini" width="400" height="300" aria-hidden="true"></canvas>

const carRoot = new THREE.Group(); scene.add(carRoot);
function buildCar(){
  carRoot.clear(); const T = CARS[car.kind];
  const body = new THREE.Mesh(new THREE.BoxGeometry(T.W, T.H * .55, T.L), lam(T.col)); body.position.y = .35 + T.H * .27; carRoot.add(body);
  const cab = new THREE.Mesh(new THREE.BoxGeometry(T.W * .8, T.H * .45, T.L * .45), lam('#2b2f36')); cab.position.set(0, .35 + T.H * .72, -T.L * .05); carRoot.add(cab);
  for (const [sx, sz] of [[-1, 1], [1, 1], [-1, -1], [1, -1]]){ const w = new THREE.Mesh(new THREE.CylinderGeometry(.36, .36, .3, 10), lam('#1b1d21')); w.rotation.z = Math.PI / 2; w.position.set(sx * T.W / 2, .36, sz * T.wb / 2); carRoot.add(w); }
}
function placeAt(i){
  const j = wi(i); car.i = j; car.good = j; car.x = PT[j][0]; car.z = PT[j][1]; car.y = Y[j]; car.h = HD[j]; car.vx = car.vz = car.vy = 0; car.lastVy = 0; car.air = false; car.steer = 0; car.loop = null; camInit = false;
}

/* ---------- input ---------- */
const keys = {}, tk = {};
addEventListener('keydown', e => { keys[e.code] = true; if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault(); if (e.code === 'KeyR') resetCar(); });
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('#touch button').forEach(b => {
  const on = e => { e.preventDefault(); tk[b.dataset.k] = true; b.classList.add('on'); }, off = () => { tk[b.dataset.k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
});
function input(){
  const thr = ((keys.KeyW || keys.ArrowUp || tk.G) ? 1 : 0) - ((keys.KeyS || keys.ArrowDown || tk.B) ? 1 : 0);
  const steer = ((keys.KeyA || keys.ArrowLeft || tk.L) ? 1 : 0) - ((keys.KeyD || keys.ArrowRight || tk.R) ? 1 : 0);
  return {thr, steer, brake:!!keys.Space, nos:!!(keys.ShiftLeft || keys.ShiftRight || keys.KeyN || tk.N)};
}

/* ---------- where the car is on the circuit ---------- */
function locate(c){
  let bi = c.i, bd = 1e18;
  for (let d = -25; d <= 25; d++){ const i = wi(c.i + d), dx = c.x - PT[i][0], dz = c.z - PT[i][1], q = dx * dx + dz * dz; if (q < bd){ bd = q; bi = i; } }
  c.i = bi; const lat = (c.x - PT[bi][0]) * RT[bi][0] + (c.z - PT[bi][1]) * RT[bi][1];
  const a = Math.abs(lat), hw = HW[bi];
  return {i:bi, lat, s:a <= hw ? 'track' : a <= hw + 2.4 && kerbOn(bi) ? 'kerb' : 'grass'};
}
const a0Of = T => 13 * Math.pow(T.grip / 8.2, .6);

/* ---------- physics: js/40-vehicles.js updateCar (ground part) inside the js/94-f1-drive.js circuit wrapper ---------- */
function step(c, dt, inp){
  const T0 = CARS[c.kind];
  if (c.loop) return loopStep(c, dt);
  const W = locate(c), T = Object.assign({}, T0);
  let fx = Math.sin(c.h), fz = Math.cos(c.h), rx = fz, rz = -fx;
  let vf = c.vx * fx + c.vz * fz, vl = c.vx * rx + c.vz * rz; const v = Math.abs(vf);
  /* nitro (js/94-tuning-drive.js): maxV × (1 + mult), acc × (1 + 3.2 mult) */
  const nos = T0.nos; let want = 0;
  if (nos){ if (inp.nos && c.e > 0 && !c.air){ c.e = Math.max(0, c.e - dt / nos.cap); want = nos.pow; } else if (!inp.nos) c.e = Math.min(1, c.e + dt / nos.fill); }
  c.mult = want > c.mult ? want : Math.max(want, c.mult - dt * .5);
  /* circuit handling */
  const asphalt = W.s !== 'grass', q = Math.min(2, (v / 50) ** 2), a0 = a0Of(T0);
  let steer = inp.steer, brake = inp.brake, thr = inp.thr;
  const aMax = a0 * (asphalt ? 1 + CFG.df * q : .75) * (brake && asphalt ? 2.2 : 1), vv = Math.max(v, 4);
  const kRaw = Math.atan(T.wb * aMax * CFG.grip / (vv * vv)) * (1 + .025 * v) / T.steer, k = Math.min(1, Math.max(CFG.floor * Math.min(1, (80 / vv) ** 2), kRaw));
  c.want += (steer - c.want) * Math.min(1, dt * 2.5);
  let over = 0;
  if (asphalt && !brake && v > 8 && Math.abs(c.want) > .35){
    let kc = 0; const ahead = Math.round(Math.min(CFG.look * 60, 6 + v * CFG.look / 3));
    for (let d = 0; d <= ahead; d += 2){ const cv = K[wi(W.i + d)]; if (Math.sign(cv) === Math.sign(c.want)) kc = Math.max(kc, Math.abs(cv)); }   /* steering INTO the bend */
    if (kc > 1 / 400){ const vOk = Math.sqrt(aMax * CFG.grip / kc); if (v > vOk) over = Math.min(1, (v - vOk) / Math.max(4, vOk) * 3) * Math.min(1, Math.abs(c.want) * 1.4); }
  }
  steer *= k;
  if (asphalt){
    T.grip = T0.grip * (1 + CFG.df * q * .8) * (1 - CFG.slide * over);
    /* nitro first, then the circuit cap (the game eases against the cap before nitro multiplies it, so under nitro there is no cap at all: plan §1.2) */
    const top = T0.maxV, cap = (top > CFG.VKNEE ? CFG.VKNEE + (top - CFG.VKNEE) * .5 : top) * (1 + c.mult);
    T.maxV = v > cap ? Math.max(cap, v - 9 * dt) : cap;
  } else { brake = false; T.grip = Math.max(T0.grip, 7) * 1.25; T.acc = T0.acc * .65; T.maxV = Math.min(T0.maxV, Math.max(v - 3 * dt, 32)) * (1 + c.mult); }
  T.acc *= 1 + c.mult * 3.2;
  /* updateCar, ground branch */
  if (!c.air){
    if (thr > 0) vf += T.acc * thr * dt * (vf < -.5 ? 2.5 : 1);
    else if (thr < 0){ if (vf > .5) vf += T.acc * 2.4 * thr * dt; else vf += T.acc * .7 * thr * dt; }
    else vf -= Math.sign(vf) * Math.min(Math.abs(vf), 2.2 * dt);
    vf -= vf * .1 * dt;
    vf = Math.max(-T.maxV * .35, Math.min(T.maxV, vf));
    vl -= vl * Math.min(1, (brake ? 1.1 : T.grip) * dt);
    if (brake) vf -= vf * .55 * dt;
    c.steer += (steer * T.steer - c.steer) * Math.min(1, dt * 7);
    const se = c.steer / (1 + Math.abs(vf) * .025);
    c.vx = fx * vf + rx * vl; c.vz = fz * vf + rz * vl;
    c.h += vf / T.wb * Math.tan(se) * dt * (brake ? 1.9 : 1);
  }
  if (!asphalt && !c.air){ const f = Math.exp(-.5 * dt); c.vx *= f; c.vz *= f; }
  const dec = over > .02 ? CFG.scrub * over * (1 + CFG.sv * v / 50) : 0, sp = Math.hypot(c.vx, c.vz);
  if (dec > 0 && sp > 1 && !c.air){ const f = Math.max(0, 1 - dec * dt / sp); c.vx *= f; c.vz *= f; }
  c.over = over;
  /* move; walls on the helix / deck */
  c.x += c.vx * dt; c.z += c.vz * dt;
  if (ELEV(W.i)){ const lat = (c.x - PT[W.i][0]) * RT[W.i][0] + (c.z - PT[W.i][1]) * RT[W.i][1], hw = HW[W.i] - c.W2;
    if (Math.abs(lat) > hw){ const s = Math.sign(lat), push = Math.abs(lat) - hw; c.x -= RT[W.i][0] * s * push; c.z -= RT[W.i][1] * s * push;
      const vn = c.vx * RT[W.i][0] + c.vz * RT[W.i][1]; if (vn * s > 0){ c.vx -= RT[W.i][0] * vn * 1.3; c.vz -= RT[W.i][1] * vn * 1.3; c.vx *= .97; c.vz *= .97; } } }
  /* height: the road under the car (its own index keeps the helix layers apart); crests can throw it */
  const W2 = locate(c), g = Math.abs(W2.lat) < HW[W2.i] + 8 || ELEV(W2.i) ? Y[W2.i] : 0;
  if (c.air){ c.vy -= 26 * dt; c.y += c.vy * dt; if (c.y <= g){ c.y = g; c.air = false; c.vy = 0; c.lastVy = 0; } }
  else { const vy = (g - c.y) / Math.max(dt, 1e-3); if (g < c.y - .3 && c.lastVy > 1){ c.air = true; c.vy = c.lastVy * 1.25; } else { c.y = g; c.lastVy = Math.max(-5, Math.min(20, vy)); } }
  const tp = -Math.atan2(c.air ? c.vy : c.lastVy, Math.max(5, v)) * .85; c.pitch += (tp - c.pitch) * Math.min(1, dt * 8);
  if (W2.s === 'track' && Math.abs(W2.lat) < HW[W2.i] - 1) c.good = W2.i;
  /* the loop: left half of the road, fast enough → scripted ride (js/92-stuntpark.js loopStep, any heading) */
  const passed = wi(c.prevI - LOOP_I) > N / 2 && wi(W2.i - LOOP_I) < 10;
  if (passed && W2.lat < 0 && W2.lat > -12 && v >= LOOP_MIN && vf > 0) c.loop = {th:0, v0:v, x0:c.x, z0:c.z, y0:c.y, h:HD[LOOP_I]};
  else if (passed && W2.lat < 0 && W2.lat > -12 && vf > 0) flash(`进环至少 ${Math.ceil(LOOP_MIN * 3.6)} km/h，走右侧慢车道`);
  c.prevI = W2.i; c.surface = W2.s;
}
function loopStep(c, dt){
  const L = c.loop, R = LOOP.R, g = LOOP.g, v = Math.max(1.5, Math.sqrt(Math.max(0, L.v0 * L.v0 - 2 * g * R * (1 - Math.cos(L.th)))));
  L.th += v * dt / R;
  const fx = Math.sin(L.h), fz = Math.cos(L.h), rx = fz, rz = -fx, th = Math.min(L.th, Math.PI * 2), side = LOOP.w * th / (Math.PI * 2);
  c.x = L.x0 + fx * R * Math.sin(th) + rx * side; c.z = L.z0 + fz * R * Math.sin(th) + rz * side; c.y = L.y0 + R * (1 - Math.cos(th)); c.pitch = -th;
  if (L.th >= Math.PI * 2){ c.loop = null; c.pitch = 0; c.y = L.y0; c.vx = fx * L.v0; c.vz = fz * L.v0; c.h = L.h; flash(`360° 大回环！进环 ${Math.round(L.v0 * 3.6)} km/h`); }
}

/* ---------- laps: start line, four checkpoints in order, reset voids the lap ---------- */
const LAP = {t:null, last:null, best:null, cp:0, void:false};
try { const s = JSON.parse(localStorage.getItem('xmum-proto-sepang') || '{}'); LAP.bestBy = s.best || {}; } catch(e){ LAP.bestBy = {}; }
const CPS = [Math.round(N * .25), Math.round(N * .5), Math.round(N * .75)];
function lapTick(dt){
  const i = car.i;
  if (LAP.t != null) LAP.t += dt;
  if (LAP.cp < CPS.length && Math.abs(wi(i - CPS[LAP.cp])) < 8) LAP.cp++;
  const crossed = wi(car.prevLapI - SF) > N / 2 && wi(i - SF) < 10;
  if (crossed){
    if (LAP.t != null && LAP.cp === CPS.length && !LAP.void){
      LAP.last = LAP.t; const b = LAP.bestBy[car.kind];
      if (!b || LAP.t < b){ LAP.bestBy[car.kind] = LAP.t; try { localStorage.setItem('xmum-proto-sepang', JSON.stringify({best:LAP.bestBy})); } catch(e){} flash('新的最快圈 ' + fmt(LAP.t)); }
    } else if (LAP.t != null && LAP.void) flash('这圈用过「回赛道」，不算成绩');
    LAP.t = 0; LAP.cp = 0; LAP.void = false;
  }
  car.prevLapI = i;
}
const fmt = t => t == null ? '—' : Math.floor(t / 60) + ':' + (t % 60).toFixed(2).padStart(5, '0');
function resetCar(){ const i = car.good; placeAt(i); car.prevI = car.prevLapI = i; LAP.void = LAP.t != null; flash('回到赛道上（这圈不算）'); }
let msgT = 0; function flash(t){ const m = document.getElementById('msg'); m.textContent = t; m.style.display = 'block'; msgT = 2.2; }

/* ---------- advisory chip: the slowest corner in the next 350 m, at 1.2 × this car's grip (like js/94-f1-drive.js) ---------- */
function advSpeed(kAbs, a0){ const A = a0 * CFG.adv; let lo = 0, hi = 160; for (let n = 0; n < 30; n++){ const v = (lo + hi) / 2; if (v * v * kAbs <= A * (1 + CFG.df * Math.min(2, (v / 50) ** 2))) lo = v; else hi = v; } return lo; }
const advEl = document.getElementById('adv');
function advTick(){
  const a0 = a0Of(CARS[car.kind]); let best = null;
  for (const k in TI){ const d = wi(TI[k] - car.i) * 3; if (d > 350 || d < 0) continue; let kk = 0; for (let e = -8; e <= 8; e++) kk = Math.max(kk, Math.abs(K[wi(TI[k] + e)]));
    let vA = advSpeed(kk, a0) * 3.6; if (k === '4') vA *= Math.sqrt(1.35); if (!best || vA < best.v) best = {k, v:vA, d}; }
  if (!best || best.v > CARS[car.kind].maxV * 3.6 * .98){ advEl.hidden = true; return; }
  const v = Math.hypot(car.vx, car.vz) * 3.6; advEl.hidden = false;
  advEl.className = 'panel ' + (v <= best.v * 1.03 ? 'ok' : v <= best.v * 1.25 ? 'near' : 'over');
  advEl.innerHTML = `T${best.k} 建议 <b>${Math.round(best.v)}</b> km/h · ${Math.round(best.d)} m`;
}

/* ---------- car buttons ---------- */
const carsEl = document.getElementById('cars');
for (const k in CARS){ const b = document.createElement('button'); b.type = 'button'; b.textContent = CARS[k].name; b.dataset.k = k; b.setAttribute('aria-pressed', String(k === car.kind));
  b.addEventListener('click', () => { car.kind = k; car.W2 = CARS[k].W / 2; buildCar(); placeAt(SF - 30); car.prevI = car.prevLapI = car.i; LAP.t = null; LAP.cp = 0; car.e = 1; car.mult = 0;
    carsEl.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.k === k))); document.getElementById('nos').hidden = !CARS[k].nos; b.blur(); });
  carsEl.appendChild(b); }

/* ---------- minimap ---------- */
const mini = document.getElementById('mini'), mg = mini.getContext('2d');
let bx0 = 1e9, bx1 = -1e9, bz0 = 1e9, bz1 = -1e9; for (const [x, z] of PT){ bx0 = Math.min(bx0, x); bx1 = Math.max(bx1, x); bz0 = Math.min(bz0, z); bz1 = Math.max(bz1, z); }
const ms = Math.min(360 / (bx1 - bx0), 260 / (bz1 - bz0)), mx = x => 20 + (x - bx0) * ms, mz = z => 20 + (z - bz0) * ms;
function drawMini(){
  mg.clearRect(0, 0, 400, 300); mg.lineWidth = 6; mg.strokeStyle = '#5d6168'; mg.lineJoin = 'round'; mg.beginPath();
  PT.forEach(([x, z], i) => i ? mg.lineTo(mx(x), mz(z)) : mg.moveTo(mx(x), mz(z))); mg.closePath(); mg.stroke();
  mg.fillStyle = '#e8412c'; mg.beginPath(); mg.arc(mx(car.x), mz(car.z), 8, 0, 7); mg.fill();
}

/* ---------- loop ---------- */
car.W2 = CARS[car.kind].W / 2; buildCar(); placeAt(SF - 30); car.prevI = car.prevLapI = car.i;
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(); let last = performance.now(), miniT = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; const inp = input();
  for (let s = 0; s < 3; s++) step(car, dt / 3, inp);
  lapTick(dt); advTick();
  carRoot.position.set(car.x, car.y, car.z); carRoot.rotation.set(car.pitch, car.h, 0, 'YXZ');
  const fx = Math.sin(car.h), fz = Math.cos(car.h), v = Math.hypot(car.vx, car.vz);
  const back = car.loop ? 16 : 9 + Math.min(4, v / 30);
  camPos.set(car.x - fx * back, car.y + 3.4 + (car.loop ? 6 : 0), car.z - fz * back);
  if (!camInit){ camera.position.copy(camPos); camInit = true; } else camera.position.lerp(camPos, Math.min(1, dt * 6));
  camLook.set(car.x + fx * 8, car.y + 1.2, car.z + fz * 8); camera.lookAt(camLook);
  const fov = 62 + Math.max(0, Math.min(1, (v - 22) / 60)) * 12; if (Math.abs(camera.fov - fov) > .05){ camera.fov += (fov - camera.fov) * Math.min(1, dt * 2); camera.updateProjectionMatrix(); }
  document.getElementById('spd').innerHTML = Math.round(v * 3.6) + '<small>km/h' + (car.mult > .05 ? ' · 氮气' : '') + (car.over > .3 ? ' · 擦胎' : '') + (car.surface === 'grass' ? ' · 草地' : '') + '</small>';
  document.getElementById('lap').innerHTML = `本圈 ${fmt(LAP.t)}${LAP.void ? '（不算）' : ''}<br>上圈 ${fmt(LAP.last)}<br>最快 ${fmt(LAP.bestBy[car.kind])}`;
  if (CARS[car.kind].nos) document.querySelector('#nos i').style.width = (car.e * 100).toFixed(0) + '%';
  if (msgT > 0){ msgT -= dt; if (msgT <= 0) document.getElementById('msg').style.display = 'none'; }
  if ((miniT -= dt) <= 0){ miniT = .1; drawMini(); }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
window.XProto = {car, step, PT, K, TI, Y, HW, CARS, placeAt, LAP, SF, N};   /* for tests in the console */
</script>
</body>
</html>
