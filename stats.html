<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>玩家数据 · XMUM 校园漫游</title>
<meta name="description" content="XMUM 校园漫游的实时玩家数据：多少人在玩、玩了多久、玩哪个模式。">
<style>
  :root{color-scheme:light;--page:#f9f9f7;--ink:#0b0b0b;--ink2:#52514e;--line:#e1e0d9;--link:#2a78d6;--card:#fcfcfb;--muted:#898781}
  @media (prefers-color-scheme: dark){:root{color-scheme:dark;--page:#0d0d0d;--ink:#f0efec;--ink2:#c3c2b7;--line:#2c2c2a;--link:#6da7ec;--card:#1a1a19;--muted:#898781}}
  body{margin:0;background:var(--page);color:var(--ink);font:15px/1.6 system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}
  main{max-width:820px;margin:0 auto;padding:24px 16px 48px}
  h1{font-size:24px;margin:0 0 4px}
  .sub{color:var(--ink2);margin:0 0 18px;font-size:14px}
  a{color:var(--link)}
  #charts{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
  #charts svg{width:100%;height:auto;display:block}
  .scroll{overflow-x:auto;border-radius:12px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 16px;padding:18px 20px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  .tiles div{display:flex;flex-direction:column;gap:4px}
  .tiles span{color:var(--ink2);font-size:13px}
  .tiles b{font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
  .tiles small{font-size:14px;font-weight:400;color:var(--ink2);margin-left:6px}
  .tiles p{grid-column:1/-1;margin:4px 0 0;color:var(--muted);font-size:12px}
  @media (max-width:640px){
    .tiles{grid-template-columns:1fr 1fr}
    .tiles b{font-size:28px}
    .scroll svg{min-width:640px}
  }
  #status{color:var(--ink2);font-size:14px;min-height:1.6em}
  details{border:1px solid var(--line);border-radius:12px;padding:10px 14px}
  summary{cursor:pointer;color:var(--ink2)}
  table{border-collapse:collapse;width:100%;margin-top:10px;font-size:14px;font-variant-numeric:tabular-nums}
  th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
  th:first-child,td:first-child{text-align:left}
</style>
</head>
<body>
<main>
  <h1>玩家数据</h1>
  <p class="sub">XMUM 校园漫游 · 打开就是最新的数据 · <a href="./">回到游戏</a> · <a href="https://github.com/iZHENGjy/xmum-campus#玩家数据">怎么算的</a></p>
  <p id="status">正在读取数据…</p>
  <div id="charts"></div>
</main>
<script src="js/firebase-config.js?v=19"></script>
<script src="js/stats-view.js?v=19"></script>
</body>
</html>
